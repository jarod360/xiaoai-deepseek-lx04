name: LX04 v42 stock Binder transaction fix
on:
  push:
    branches: [test/lx04-binder-transaction-v42]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: cd diagnostics/binder-probe && gradle --no-daemon :app:assembleDebug
      - run: sha256sum diagnostics/binder-probe/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lx04-binder-stock-tx15-v42-apk
          path: diagnostics/binder-probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
